name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Kryvanta-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B package
        working-directory: kryvanta
      - uses: actions/upload-artifact@v4
        with:
          name: Kryvanta
          path: kryvanta/target/Kryvanta-*.jar
