name: build
on: [push, workflow_dispatch]
jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: plugin/pom.xml
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: Kryvanta
          path: plugin/target/Kryvanta-*.jar

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kryvanta_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kryvanta_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next build

  server-smoke:
    needs: [plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kryvanta?schema=public
      PLUGIN_API_SECRET: ci-plugin-secret-0123456789
      APP_SECRET: ci-app-secret-0123456789
      APP_URL: http://127.0.0.1:3000
      PAYMENT_PROVIDER: manual
      SEED_ADMIN_EMAIL: admin@ci.local
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: Kryvanta
          path: plugin/target
      - name: Start website
        working-directory: web
        run: |
          npm ci
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
          npx next build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
      - name: Boot Paper 1.21.11 + LuckPerms + Kryvanta
        run: bash ci/server-smoke.sh
      - if: always()
        run: tail -50 web.log || true
