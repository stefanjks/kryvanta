# /etc/nginx/sites-available/kryvanta — HTTPS через Let's Encrypt (certbot --nginx -d kryvanta.example.com)
server {
    listen 80;
    server_name kryvanta.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kryvanta.example.com;

    ssl_certificate     /etc/letsencrypt/live/kryvanta.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kryvanta.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # сайт берёт IP клиента из X-Forwarded-For (TRUST_PROXY=true) — перезаписываем, а не дополняем
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
